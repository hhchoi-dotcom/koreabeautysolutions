<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — PT Korea Beauty Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #F7F2EB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 64px 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 48px rgba(44,36,22,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 900; color: #2C2416; margin-bottom: 12px; }
    p { font-size: 16px; color: #5C5440; line-height: 1.75; margin-bottom: 32px; }
    a {
      display: inline-block;
      background: #9B7E5A;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      transition: background 0.25s;
    }
    a:hover { background: #C4A878; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✉️</div>
    <h1>Message Sent!</h1>
    <p>Thank you for reaching out. We've received your message and will get back to you shortly.</p>
    <a href="/output/b2c.html">← Back to Home</a>
  </div>
</body>
</html>
